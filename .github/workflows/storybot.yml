name: storybot

on:
  schedule:
    - cron: "17 5 * * *"   # once a day, ~06:17 Paris time in winter
  workflow_dispatch:
    inputs:
      story_file:
        description: "Render an existing story JSON instead of writing a new one (optional)"
        type: string
        default: ""
      story_type:
        description: "Force a story type, e.g. What if scenario (optional)"
        type: string
        default: ""
      bg_mode:
        description: "Background: gameplay, scenes (cartoon illustrations) or auto"
        type: string
        default: ""

concurrency:
  group: storybot-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg + OpenGL (only what's missing)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          ldconfig -p | grep -q libEGL.so.1 || need="$need libegl1"
          ls /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so /usr/lib/x86_64-linux-gnu/dri/*llvmpipe* >/dev/null 2>&1 || need="$need libgl1-mesa-dri"
          echo "installing:$need"
          if [ -n "$need" ]; then
            sudo rm -f /var/lib/man-db/auto-update
            timeout 600 sudo -E apt-get update -qq
            timeout 900 sudo -E apt-get install -y -qq --no-install-recommends $need
          fi
          python -c "import moderngl; moderngl.create_context(standalone=True, backend='egl'); print('opengl ok')" || echo "::warning::OpenGL not available"

      - name: Fallback font
        run: |
          fc-list | grep -qi poppins || (mkdir -p ~/.fonts && curl -sSL -o ~/.fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf && fc-cache -f)

      - name: Voice model (cached)
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model if missing
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ] || curl -sSL -o models/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Write story
        id: story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE_TYPE: ${{ inputs.story_type }}
        run: |
          if [ -n "${{ inputs.story_file }}" ]; then F="${{ inputs.story_file }}"; else
            F="stories/$(date -u +%Y-%m-%d-%H%M).json"; python write_story.py "$F"; fi
          echo "file=$F" >> "$GITHUB_OUTPUT"

      - name: Save story history
        run: |
          git config user.name storybot && git config user.email storybot@users.noreply.github.com
          git add stories state playbook.md && git commit -qm "story $(date -u +%F)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 7; done

      - name: Get gameplay clips (upload yours to a release tagged "backgrounds")
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download backgrounds -p "*.mp4" -D backgrounds || echo "no gameplay clips yet - using AI scenes"

      - name: Render videos
        env:
          BG_MODE: ${{ inputs.bg_mode || vars.BG_MODE || 'auto' }}
          SCENE_STYLE: ${{ vars.SCENE_STYLE }}
          VOICE_RATE: ${{ vars.VOICE_RATE || '10' }}
          VOICE: ${{ vars.VOICE }}
        run: python make_video.py "${{ steps.story.outputs.file }}" out

      - name: Write caption file
        run: |
          python - <<'PY'
          import json
          s = json.load(open("${{ steps.story.outputs.file }}"))
          caps = s.get("captions") or [s.get("caption", s["title"] + " #storytime #fyp")] * len(s["parts"])
          bgs = json.load(open("out/meta.json"))["backgrounds"]
          epic = ("\nPortions of the materials used are trademarks and/or copyrighted works of Epic Games, Inc. "
                  "All rights reserved by Epic. This material is not official and is not endorsed by Epic.")
          with open("out/captions.txt", "w") as f:
              for i in range(1, len(s["parts"]) + 1):
                  extra = epic if "fortnite" in bgs[i - 1].lower() else ""
                  f.write(f"PART {i}:\n{caps[i - 1]}{extra}\n\n")
          PY

      - name: Publish videos as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="story-$(date -u +%Y%m%d-%H%M)"
          TITLE=$(python -c "import json;print(json.load(open('${{ steps.story.outputs.file }}'))['title'])")
          gh release create "$TAG" out/part*.mp4 out/captions.txt --title "$TITLE" --notes-file out/captions.txt
