name: voice-sampler
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q edge-tts
      - name: ffmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
        run: command -v ffmpeg >/dev/null || (timeout 600 sudo -E apt-get update -qq && timeout 900 sudo -E apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Font
        run: |
          fc-list | grep -qi poppins || (mkdir -p ~/.fonts && curl -sSL -o ~/.fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf && fc-cache -f)
      - run: python voice_sampler.py voice-sampler.mp4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "voices-$(date -u +%Y%m%d-%H%M)" voice-sampler.mp4 --title "Voice sampler" --notes "Pick a number and set repo variable VOICE." --prerelease
